name: hamstrong
description: "Hamstrong - gym workout and progress tracker with a hamster mascot (prototype)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    # Variable fonts from github.com/google/fonts, SIL OFL 1.1, see assets/fonts/OFL-*.txt.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
